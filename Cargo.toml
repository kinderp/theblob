[workspace]
resolver = "2"
members = [
    "crates/blob-core",
    "crates/blob-alfred",
    "crates/blob-resolver",
    "crates/blob-executor",
    "crates/blob-history",
    "crates/blob-mvp",
]
exclude = [
    "renderers/blob-surface-slint",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"
