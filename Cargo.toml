[workspace]
resolver = "2"
members = [
    "crates/blob-core",
    "crates/blob-alfred",
    "crates/blob-resolver",
    "crates/blob-executor",
    "crates/blob-system-executor",
    "crates/blob-system-activation-gate",
    "crates/blob-node-probe",
    "crates/blob-history",
    "crates/blob-mvp",
    "crates/blob-technician",
    "backends/blob-nix-nixos",
    "backends/blob-nix-nixos-activation",
    "backends/blob-nix-nixos-privileged-helper",
    "backends/blob-nix-nixos-root-boundary",
    "backends/blob-nix-nixos-authority",
    "backends/blob-nix-nixos-request-store",
    "backends/blob-nix-nixos-request-publisher",
    "backends/blob-nix-nixos-materialization-authority",
]
exclude = [
    "renderers/blob-surface-slint",
    "runtimes/blob-wasm-wasmtime",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"