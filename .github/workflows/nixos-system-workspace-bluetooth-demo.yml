name: NixOS System Workspace Bluetooth demo

on:
  pull_request:

permissions:
  contents: read

jobs:
  system-workspace-bluetooth-demo-vm:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/demo-system-workspace-bluetooth-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove System Workspace Bluetooth proposal reaches admitted VM materialization
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.system-workspace-bluetooth-demo 2>&1 | tee /tmp/system-workspace-bluetooth-demo.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 280 /tmp/system-workspace-bluetooth-demo.log > /tmp/system-workspace-bluetooth-demo-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-workspace-bluetooth-demo-failure-tail
          path: /tmp/system-workspace-bluetooth-demo-tail.log
          if-no-files-found: ignore
