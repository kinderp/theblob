name: NixOS materialization to request

on:
  pull_request:

permissions:
  contents: read

jobs:
  materialization-to-request-vm:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-materialization-to-request-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove recovered materialization admission feeds exact prepared request
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.materialization-to-request 2>&1 | tee /tmp/materialization-to-request.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 220 /tmp/materialization-to-request.log > /tmp/materialization-to-request-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: materialization-to-request-failure-tail
          path: /tmp/materialization-to-request-tail.log
          if-no-files-found: ignore
