name: NixOS materialization admission

on:
  pull_request:
    branches:
      - feature/nixos-root-request-publisher-vm

permissions:
  contents: read

jobs:
  materialization-admission-vm:
    if: github.head_ref == 'feature/nixos-materialization-admission-vm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove non-root realization is bound to root-predicted derivation output
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.materialization-admission 2>&1 | tee /tmp/materialization-admission.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 180 /tmp/materialization-admission.log > /tmp/materialization-admission-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: materialization-admission-failure-tail
          path: /tmp/materialization-admission-tail.log
