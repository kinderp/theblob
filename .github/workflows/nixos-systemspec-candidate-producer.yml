name: NixOS SystemSpec candidate producer

on:
  pull_request:

permissions:
  contents: read

jobs:
  systemspec-candidate-producer-vm:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-systemspec-manifest-producer-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove canonical SystemSpec derives exact trusted candidate manifest
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.systemspec-candidate-producer 2>&1 | tee /tmp/systemspec-candidate-producer.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 240 /tmp/systemspec-candidate-producer.log > /tmp/systemspec-candidate-producer-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: systemspec-candidate-producer-failure-tail
          path: /tmp/systemspec-candidate-producer-tail.log
          if-no-files-found: ignore
