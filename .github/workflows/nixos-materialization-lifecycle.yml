name: NixOS materialization lifecycle

on:
  pull_request:

permissions:
  contents: read

jobs:
  materialization-lifecycle-vm:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-materialization-lifecycle-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove fail-closed materialization lifecycle and GC handoff
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.materialization-lifecycle 2>&1 | tee /tmp/materialization-lifecycle.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 300 /tmp/materialization-lifecycle.log > /tmp/materialization-lifecycle-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: materialization-lifecycle-failure-tail
          path: /tmp/materialization-lifecycle-tail.log
          if-no-files-found: ignore
