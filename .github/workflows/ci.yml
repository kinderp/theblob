name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust core MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup component add rustfmt

      - name: Parse and normalize core Rust formatting
        run: cargo fmt --all

      - name: Test core workspace
        run: cargo test --workspace

  slint-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      - name: Install renderer Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup component add rustfmt

      - name: Parse and normalize renderer formatting
        working-directory: renderers/blob-surface-slint
        run: cargo fmt --all

      - name: Compile Blob Native Slint renderer
        working-directory: renderers/blob-surface-slint
        run: cargo check --all-targets

  wasm-component-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime Rust toolchain and WASIp2 target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup component add rustfmt
          rustup target add wasm32-wasip2

      - name: Parse and normalize runtime formatting
        working-directory: runtimes/blob-wasm-wasmtime
        run: cargo fmt --all

      - name: Format WASIp2 filesystem probe
        working-directory: runtimes/blob-wasm-wasmtime/fixtures/fs-probe
        run: cargo fmt --all --check

      - name: Build WASIp2 filesystem probe
        working-directory: runtimes/blob-wasm-wasmtime/fixtures/fs-probe
        run: cargo build --target wasm32-wasip2 --release --target-dir ../../target/wasi-fixtures

      - name: Test deny-by-default and explicit-grant Component runtime
        working-directory: runtimes/blob-wasm-wasmtime
        run: cargo test

  nixos-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust core MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Regenerate reference NixOS module from SystemSpec
        run: |
          cargo run -q -p blob-nix-nixos --example render_reference > /tmp/blob-generated.nix
          diff -u backends/blob-nix-nixos/nix/reference/generated.nix /tmp/blob-generated.nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve NixOS 26.05 reference inputs
        working-directory: backends/blob-nix-nixos/nix/reference
        run: nix flake metadata

      - name: Evaluate NixOS system derivation
        working-directory: backends/blob-nix-nixos/nix/reference
        run: nix eval --raw .#nixosConfigurations.blob-pilot.config.system.build.toplevel.drvPath

      - name: Evaluate NixOS VM derivation
        working-directory: backends/blob-nix-nixos/nix/reference
        run: nix eval --raw .#nixosConfigurations.blob-pilot.config.system.build.vm.drvPath

      - name: Materialize candidate through Blob non-privileged executor
        run: cargo run -q -p blob-system-executor --example materialize_reference

  nixos-vm-build:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-vm-build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build real NixOS VM candidate
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          out=$(nix build --no-link --print-out-paths .#nixosConfigurations.blob-pilot.config.system.build.vm)
          echo "Built VM candidate: $out"
          test -d "$out/bin"
          ls -la "$out/bin"

  nixos-vm-boot:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-vm-boot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build smoke-test NixOS VM candidate
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          out=$(nix build --no-link --print-out-paths .#nixosConfigurations.blob-pilot-smoke.config.system.build.vm)
          echo "$out" > /tmp/blob-smoke-vm-path
          echo "Built smoke VM candidate: $out"
          ls -la "$out/bin"

      - name: Boot candidate to userspace and observe marker
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          out=$(cat /tmp/blob-smoke-vm-path)
          runner=$(find "$out/bin" -maxdepth 1 \( -type f -o -type l \) | head -n1)
          test -n "$runner"
          rm -f blob-pilot.qcow2

          set +e
          output=$(timeout 90s env \
            QEMU_OPTS="-nographic -serial mon:stdio" \
            QEMU_KERNEL_PARAMS="console=ttyS0" \
            "$runner" 2>&1)
          rc=$?
          set -e

          printf '%s\n' "$output"
          grep -q 'BLOB_VM_BOOT_OK' <<< "$output"
          test "$rc" -eq 0
