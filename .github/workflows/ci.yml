name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust core MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup component add rustfmt

      - name: Parse and normalize core Rust formatting
        run: cargo fmt --all

      - name: Test core workspace
        run: cargo test --workspace

  slint-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      - name: Install renderer Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup component add rustfmt

      - name: Parse and normalize renderer formatting
        working-directory: renderers/blob-surface-slint
        run: cargo fmt --all

      - name: Compile Blob Native Slint renderer
        working-directory: renderers/blob-surface-slint
        run: cargo check --all-targets

  wasm-component-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime Rust toolchain and WASIp2 target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup component add rustfmt
          rustup target add wasm32-wasip2

      - name: Parse and normalize runtime formatting
        working-directory: runtimes/blob-wasm-wasmtime
        run: cargo fmt --all

      - name: Format WASIp2 filesystem probe
        working-directory: runtimes/blob-wasm-wasmtime/fixtures/fs-probe
        run: cargo fmt --all --check

      - name: Build WASIp2 filesystem probe
        working-directory: runtimes/blob-wasm-wasmtime/fixtures/fs-probe
        run: cargo build --target wasm32-wasip2 --release

      - name: Test deny-by-default and explicit-grant Component runtime
        working-directory: runtimes/blob-wasm-wasmtime
        run: cargo test
