name: NixOS candidate source quiescence

on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate-source-quiescence-vm:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/nixos-candidate-source-quiescence-vm')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prove candidate source reclamation waits for enqueue quiescence
        working-directory: backends/blob-nix-nixos/nix/reference
        run: |
          set -o pipefail
          nix build -L .#checks.x86_64-linux.candidate-source-quiescence 2>&1 | tee /tmp/candidate-source-quiescence.log

      - name: Preserve compact failure tail
        if: failure()
        run: tail -n 260 /tmp/candidate-source-quiescence.log > /tmp/candidate-source-quiescence-tail.log

      - name: Upload compact failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source-quiescence-failure-tail
          path: /tmp/candidate-source-quiescence-tail.log
          if-no-files-found: ignore
